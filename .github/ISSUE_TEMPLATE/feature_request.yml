name: Feature request
description: Suggest a component, check, standard or CLI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should keel do? A new component, a new answer, or a different default?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
