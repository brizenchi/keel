# Reusable: scan the full git history for secrets with gitleaks.
# Uses the caller's .gitleaks.toml and .gitleaksignore when present.
# Standard: docs/standards/SECURITY_STANDARD.md
name: secrets

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          config=()
          [ -f .gitleaks.toml ] && config=(--config .gitleaks.toml)
          ./gitleaks git . --no-banner --redact "${config[@]}"
