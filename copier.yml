# keel — engineering standards for any Git repository.
#
# Use the `keel` CLI rather than calling Copier directly:
#   keel init        install into the current repository
#   keel config      change answers / components (keeps the installed version)
#   keel update      move to a newer keel release
#
# Answers live in .keel/answers.yml. Every generated file is plain and editable:
# updates are three-way merges, so local edits survive.

_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .keel/answers.yml

# GitHub Actions uses ${{ }}, so templates use [[ … ]] / [% … %] instead of
# Jinja's defaults. Files containing a literal "[[" (TOML, bash) stay
# non-template files (no .jinja suffix).
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true

# Owned by the project after the first install; updates never overwrite them.
_skip_if_exists:
  - .github/CODEOWNERS
  - CLAUDE.md
  - SECURITY.md
  - .gitignore
  - docs/standards/PROJECT.md

_message_after_copy: |

  keel installed. Review with `git status` and `git diff`, then:

    keel status                 what is installed and what still needs doing
  [%- if 'hooks' in components %]
    keel hooks                  install the local git hooks (lefthook)
  [%- endif %]
  [%- if 'github' in components %]
    keel github --dry-run       preview GitHub settings (rulesets, squash merges, secret scanning)
  [%- endif %]
  [%- if ci_mode == 'reusable' %]
    call .github/workflows/keel.yml from your own workflow:  [[ ci_caller_job ]]: { uses: ./.github/workflows/keel.yml }
  [%- endif %]
    git add -A && git commit -m "chore: install keel"

  Change components or answers later with `keel config`, `keel enable`, `keel disable`, `keel set`.

_message_after_update: |

  keel files updated. Resolve any conflict markers, review `git diff`, then commit.

# ---------------------------------------------------------------- questions

project_name:
  type: str
  help: Project name
  default: "[[ _folder_name ]]"

github_repo:
  type: str
  help: GitHub repository (owner/name)
  default: "your-org/[[ project_name ]]"
  validator: >-
    [% if not (github_repo | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %]must look like owner/name[% endif %]

default_branch:
  type: str
  help: Default branch
  default: main

components:
  type: str
  help: Components to install (space toggles, enter confirms)
  multiselect: true
  choices:
    "docs            standards documents (docs/standards/)": docs
    "ci              language checks in CI (.github/workflows/keel.yml)": ci
    "commit-lint     PR titles must follow Conventional Commits (CI)": commit-lint
    "secrets         secret scanning: gitleaks config + CI job": secrets
    "hooks           local git hooks: secret scan + formatters (lefthook.yml)": hooks
    "github          required-checks list used by `keel github`": github
    "pr-template     pull request template": pr-template
    "codeowners      CODEOWNERS": codeowners
    "dependabot      Dependabot version updates": dependabot
    "security-policy SECURITY.md": security-policy
    "editorconfig    .editorconfig": editorconfig
    "gitignore       .gitignore (only when the project has none)": gitignore
    "ai              AI assistant rules: AGENTS.md, CLAUDE.md, Claude Code hooks": ai
  default: '["docs", "ci", "commit-lint", "secrets", "hooks", "github", "pr-template", "codeowners", "dependabot", "security-policy", "editorconfig", "gitignore", "ai"]'

# A separate yes/no question rather than a `components` entry, so projects
# installed before it existed keep these files on update (new questions take
# their default). The CLI lists and toggles it like any other component.
backend:
  type: bool
  help: "Backend / web service rules: API design, databases, incident response"
  default: true

languages:
  type: str
  help: Languages used in this repository
  multiselect: true
  choices:
    Go: go
    Node / TypeScript: node
    Python: python
  default: "[]"

go_modules:
  type: yaml
  help: "Go modules to check: list of {dir, packages?, lint?, lint_version?}"
  default: '[{"dir": "."}]'
  when: "[[ 'go' in languages ]]"

node_projects:
  type: yaml
  help: "Node projects to check: list of {dir, scripts?, node_version?, package_manager?}"
  default: '[{"dir": "."}]'
  when: "[[ 'node' in languages ]]"

python_projects:
  type: yaml
  help: "Python projects to check: list of {dir, python_version?, test_command?}"
  default: '[{"dir": "."}]'
  when: "[[ 'python' in languages ]]"

codeowners:
  type: str
  help: Default code owners (space separated GitHub handles or teams)
  default: "@[[ github_repo.split('/')[0] ]]"
  when: "[[ 'codeowners' in components ]]"

commit_scopes:
  type: yaml
  help: Suggested commit scopes, e.g. ["api", "web"] (documentation only; any scope is accepted)
  default: "[]"
  when: "[[ 'docs' in components ]]"

ci_mode:
  type: str
  help: >-
    standalone: keel.yml runs on pull requests and pushes.
    reusable: your own workflow calls it (lets a deploy job `needs:` the checks).
  choices:
    standalone: standalone
    reusable: reusable
  default: standalone
  when: "[[ 'commit-lint' in components or 'secrets' in components or ('ci' in components and languages) ]]"

ci_caller_job:
  type: str
  help: Job id in your workflow that calls keel.yml (prefixes the required check names)
  default: keel
  when: "[[ ci_mode == 'reusable' ]]"
