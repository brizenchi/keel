# dev-standards — engineering standards for any Git repository.
#
#   Install:  sh -c "$(curl -fsSL https://raw.githubusercontent.com/brizenchi/dev-standards/main/install.sh)"
#   Update:   uvx copier update
#
# Files are plain and editable. `copier update` re-applies the template with a
# three-way merge, so local edits survive; conflicts are marked inline.

_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

# GitHub Actions uses ${{ }} and shell scripts use [[ ]] in places, so templates
# use [[ … ]] / [% … %] instead of Jinja's defaults. Files containing literal
# "[[" (TOML, bash) are kept as non-template files (no .jinja suffix).
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true

# Owned by the project after the first copy: never overwritten by updates.
_skip_if_exists:
  - .github/CODEOWNERS
  - CLAUDE.md
  - SECURITY.md
  - .gitignore
  - docs/standards/PROJECT.md

_message_after_copy: |

  dev-standards installed in [[ _copier_conf.dst_path ]].

  Next steps:
    1. Review the changes:            git status && git diff
    2. Install local hooks:           brew install lefthook gitleaks && lefthook install
    3. Fill in project rules:         docs/standards/PROJECT.md and the "Project-specific rules" section of AGENTS.md
  [% if ci_mode == "reusable" %]
    4. Call the standards from your pipeline (ci_mode=reusable):
         jobs:
           [[ ci_caller_job ]]:
             uses: ./.github/workflows/standards.yml
  [% endif %]
    5. Configure the GitHub repository (branch ruleset, squash-only merges, secret scanning):
         gh auth login && .standards/bin/setup-github --dry-run   # then without --dry-run
    6. Commit:                        git add -A && git commit -m "chore: install dev-standards"

  Later, pull new versions of the standards with:  uvx copier update

_message_after_update: |

  dev-standards updated. Resolve any conflict markers, review `git diff`, run your checks, then commit.

# ---------------------------------------------------------------- questions

project_name:
  type: str
  help: Project name (used in docs)
  default: "[[ _folder_name ]]"

github_repo:
  type: str
  help: GitHub repository (owner/name)
  default: "brizenchi/[[ project_name ]]"
  validator: >-
    [% if not (github_repo | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %]must look like owner/name[% endif %]

default_branch:
  type: str
  help: Default branch
  default: main

codeowners:
  type: str
  help: Default code owners (space separated GitHub handles or teams)
  default: "@[[ github_repo.split('/')[0] ]]"

languages:
  type: str
  help: Languages used in this repository
  multiselect: true
  choices:
    Go: go
    Node / TypeScript: node
    Python: python
  default: "[]"

go_modules:
  type: yaml
  help: >-
    Go modules to check. List of {dir, packages?, lint?, lint_version?}.
    packages defaults to "./...", lint to true.
  default: '[{"dir": "."}]'
  when: "[[ 'go' in languages ]]"

node_projects:
  type: yaml
  help: >-
    Node projects to check. List of {dir, scripts?, node_version?, package_manager?}.
    scripts defaults to "lint test build" (each run with --if-present).
  default: '[{"dir": "."}]'
  when: "[[ 'node' in languages ]]"

python_projects:
  type: yaml
  help: >-
    Python projects to check. List of {dir, python_version?, test_command?}.
  default: '[{"dir": "."}]'
  when: "[[ 'python' in languages ]]"

commit_scopes:
  type: yaml
  help: Suggested commit scopes, e.g. ["api", "web", "docs"] (documentation only; any scope is accepted)
  default: "[]"

ci_mode:
  type: str
  help: >-
    standalone = .github/workflows/standards.yml runs on pull requests and pushes;
    reusable = it only runs when your own workflow calls it (use this to make deploy jobs `needs:` the standards)
  choices:
    standalone: standalone
    reusable: reusable
  default: standalone

ci_caller_job:
  type: str
  help: Job id of your workflow that calls standards.yml (used for required-check names)
  default: standards
  when: "[[ ci_mode == 'reusable' ]]"

ai_rules:
  type: bool
  help: Install AI assistant rules (AGENTS.md, CLAUDE.md, Claude Code hooks)?
  default: true
